---

- name: slackware-incus groups playbook
  gather_facts: false
  hosts: "{{ target_hosts }}"

  tasks:
    
    - name: create group
      tags: groups,incus
      become: true
      group:
        name: incus
        gid: 345
        state: present

    - name: create admin group
      tags: groups,incus-admin
      become: true
      group:
        name: incus-admin
        gid: 346
        state: present
