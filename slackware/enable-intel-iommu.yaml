---
- name: Enable Intel IOMMU via /etc/default/grub
  gather_facts: false
  hosts: "{{ target_hosts }}"
  become: true

  tasks:
    - name: Set GRUB_CMDLINE_LINUX
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="intel_iommu=on iommu.passthrough=0 iommu=force iommu.strict=1"'
        state: present

    - name: Regenerate grub.cfg
      shell: grub-mkconfig -o /boot/grub/grub.cfg
