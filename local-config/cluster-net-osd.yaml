---
# Deploy rc.inet1.conf for the LACP bond + VLAN cluster network design.
#
# Produces: 
#   eth0    management + Incus cluster (VLAN 1 / untagged)
#   eth1 storage / LINSTOR
#
# Required host_vars per node (set in host_vars/<host>/network.yaml):
#   cluster_gateway   default gateway
#   cluster_ip        br-cluster address (CIDR), e.g. 10.168.1.47/24
#   storage_ip        bond0.130 address (CIDR), e.g. 192.168.130.41/24
#

- name: Deploy bond+VLAN network config
  gather_facts: false
  hosts: "{{ target_hosts }}"

  vars:

  tasks:
    - name: Deploy rc.inet1.conf
      ansible.builtin.template:
        src: rc.d/rc.inet1.conf.osd.j2
        dest: /etc/rc.d/rc.inet1.conf
        owner: root
        group: root
        mode: '0644'
      become: true
